<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <!-- Mini App Embed Metadata -->
  <meta name="fc:miniapp" content='{"version":"1","imageUrl":"https://voluble-starship-382657.netlify.app/preview.png","button":{"title":"🎮 Play FarCastle Pinball","action":{"type":"launch_miniapp","url":"https://voluble-starship-382657.netlify.app","name":"FarCastle Pinball","splashImageUrl":"https://voluble-starship-382657.netlify.app/splash.png","splashBackgroundColor":"#1a1a1a"}}}'>
  
  <title>FarCastle Pinball</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    #gameContainer {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    #canvas {
      display: block;
      margin: 0;
      color: white;
      outline: none;
      image-rendering: optimizeSpeed;
      image-rendering: -moz-crisp-edges;
      image-rendering: -o-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      -ms-interpolation-mode: nearest-neighbor;
    }
    
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      z-index: 1000;
    }
    
    #loading h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    #loading p {
      font-size: 14px;
      color: #999;
    }
    
    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="loading">
      <div class="spinner"></div>
      <p id="loadingStatus">Initializing...</p>
    </div>
    
    <canvas id="canvas"></canvas>
  </div>
  
  <!-- Godot Engine Script -->
  <script src="index.js"></script>
  
  <script>
    // Godot will inject these during export
    var GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":96899072,"index.wasm":1648449},"focusCanvas":true,"gdextensionLibs":[]};
    var GODOT_THREADS_ENABLED = true;
    
    // Fix the config to disable COEP
    if (GODOT_CONFIG) {
        GODOT_CONFIG.ensureCrossOriginIsolationHeaders = false;
    }
    
    console.log('GODOT_CONFIG:', GODOT_CONFIG);
    console.log('GODOT_THREADS_ENABLED:', GODOT_THREADS_ENABLED);
  </script>
  
  <!-- Mini App SDK -->
  <script type="module">
    import { sdk } from 'https://esm.sh/@farcaster/miniapp-sdk@0.1.0';
    
    const API_URL = 'https://farcastle-backend.vercel.app';
    
    let currentSessionId = null;
    let currentUserFid = null;
    let gameInitialized = false;
    
    function updateLoadingStatus(status) {
      const statusEl = document.getElementById('loadingStatus');
      if (statusEl) statusEl.textContent = status;
    }
    
    async function initMiniApp() {
      try {
        updateLoadingStatus('Connecting to Farcaster...');
        
        await sdk.actions.ready();
        
        const userContext = sdk.context?.user || {};
        currentUserFid = 9055;
        if (userContext.fid && typeof userContext.fid === 'number' && userContext.fid > 0) {
          currentUserFid = userContext.fid;
        }
        
        const username = userContext.username || 'TestUser';
        
        updateLoadingStatus('Starting game session...');
        
        const response = await fetch(`${API_URL}/api/game/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fid: Number(currentUserFid) })
        });
        
        const data = await response.json();
        currentSessionId = data.sessionId;
        
        window.currentSessionId = currentSessionId;
        window.currentUserFid = currentUserFid;
        window.currentUsername = username;
        window.verifiedScore = 0;
        
        gameInitialized = true;
        
        updateLoadingStatus('Loading game...');
        
        await waitForGodotEngine();
        startGodotGame();
        
      } catch (error) {
        console.error('[FarCastle] Init error:', error);
        updateLoadingStatus('Failed to initialize: ' + error.message);
      }
    }
    
    function waitForGodotEngine() {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const check = setInterval(() => {
          if (typeof window.Engine !== 'undefined') {
            clearInterval(check);
            resolve();
          } else if (++attempts > 50) {
            clearInterval(check);
            reject(new Error('Godot Engine failed to load'));
          }
        }, 100);
      });
    }
    
    function startGodotGame() {
      const engine = new Engine(GODOT_CONFIG);
      
      engine.startGame({
        'onProgress': function (current, total) {
          if (current > 0 && total > 0) {
            const percent = Math.round((current / total) * 100);
            updateLoadingStatus(`Loading... ${percent}%`);
          }
        },
      }).then(() => {
        console.log('[FarCastle] Game started');
      });
    }
    
    // API Functions
    window.sendGameEvent = async function(sessionId, eventType, eventData) {
      if (!gameInitialized) return { success: false, score: window.verifiedScore || 0 };
      try {
        const parsedData = typeof eventData === 'string' ? JSON.parse(eventData) : eventData;
        const response = await fetch(`${API_URL}/api/game/event`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, eventType, eventData: parsedData })
        });
        const result = await response.json();
        // Update verified score if backend returns it
        if (result.score !== undefined) {
          window.verifiedScore = result.score;
        }
        return { success: true, score: window.verifiedScore || 0 };
      } catch (error) {
        console.error('[FarCastle] Event error:', error);
        return { success: false, score: window.verifiedScore || 0 };
      }
    };
    
    window.endGame = async function(sessionId) {
      if (!gameInitialized || !sessionId) return { success: false };
      try {
        const response = await fetch(`${API_URL}/api/game/end`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, fid: currentUserFid })
        });
        const data = await response.json();
        if (data.score !== undefined) {
          window.verifiedScore = data.score;
        }
        return data;
      } catch (error) {
        return { success: false };
      }
    };
    
    window.getLeaderboard = async function(limit = 10) {
      try {
        const response = await fetch(`${API_URL}/api/leaderboard?limit=${limit}`);
        return await response.json();
      } catch (error) {
        return { leaderboard: [] };
      }
    };
    
    window.getUserScores = async function(limit = 10) {
      if (!currentUserFid) return { scores: [] };
      try {
        const response = await fetch(`${API_URL}/api/user-scores/${currentUserFid}?limit=${limit}`);
        return await response.json();
      } catch (error) {
        return { scores: [] };
      }
    };
    
    window.notifyGodotReady = function() {
      const loadingDiv = document.getElementById('loading');
      if (loadingDiv) loadingDiv.style.display = 'none';
    };
    
    setTimeout(() => {
      const loadingDiv = document.getElementById('loading');
      if (loadingDiv && loadingDiv.style.display !== 'none') {
        loadingDiv.style.display = 'none';
      }
    }, 5000);
    
    initMiniApp();
  </script>
</body>
</html>
