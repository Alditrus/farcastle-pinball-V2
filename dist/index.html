  <!-- Godot Engine Script -->
  <script src="index.js"></script>
  
  <script>
    // Godot will inject these during export
    var GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":100568256,"index.wasm":1626559},"focusCanvas":true,"gdextensionLibs":[]};
    var GODOT_THREADS_ENABLED = false;
    
    console.log('GODOT_CONFIG:', GODOT_CONFIG);
    console.log('GODOT_THREADS_ENABLED:', GODOT_THREADS_ENABLED);
  </script>

  <!-- Test if JavaScript works at all -->
  <script>
    console.log('[FarCastle] Regular script executed - JavaScript is working');
    window.javascriptWorking = true;
  </script>

  <!-- Mini App SDK -->
  <script type="module">
    try {
      console.log('[FarCastle] Module script tag reached');

      const { sdk } = await import('https://esm.sh/@farcaster/miniapp-sdk@0.1.0');

      console.log('[FarCastle] SDK imported successfully:', sdk);
      window.farcasterSdk = sdk;

    const API_URL = 'https://farcastle-backend.vercel.app';

    let currentSessionId = null;
    let currentUserFid = null;
    let gameInitialized = false;
    
    function updateLoadingStatus(status) {
      // Status text removed - splash screen only
    }

    // Share score to Farcaster (opens composer)
    window.shareScore = async function(score, rank = null) {
      try {
        console.log('📤 Opening share composer with score:', score);

        const gameUrl = 'https://voluble-starship-382657.netlify.app';

        // Craft the share text
        let text;
        if (rank && rank > 0) {
          text = `🎮 Just scored ${score.toLocaleString()} points in FarCastle Pinball! 🏆\n\nRanked #${rank} on the leaderboard! Can you beat my score?`;
        } else {
          text = `🎮 Just scored ${score.toLocaleString()} points in FarCastle Pinball! 🎯\n\nThink you can beat it?`;
        }

        // Try to use SDK's addFrame method if available (for native in-app sharing)
        if (window.farcasterSdk && window.farcasterSdk.actions) {
          // Check if there's a native cast/share method
          if (typeof window.farcasterSdk.actions.addFrame === 'function') {
            console.log('Using addFrame method');
            await window.farcasterSdk.actions.addFrame({
              text: text,
              embeds: [gameUrl]
            });
            console.log('✅ Share triggered via addFrame');
            return { success: true };
          }

          // Alternative: use openUrl but with target="_self" behavior
          if (typeof window.farcasterSdk.actions.openUrl === 'function') {
            const encodedText = encodeURIComponent(text);
            const encodedUrl = encodeURIComponent(gameUrl);
            const composerUrl = `https://warpcast.com/~/compose?text=${encodedText}&embeds[]=${encodedUrl}`;

            // The SDK should handle this without opening a new tab
            await window.farcasterSdk.actions.openUrl(composerUrl);
            console.log('✅ Composer opened via SDK openUrl');
            return { success: true };
          }
        }

        // Fallback: Try using window.parent.postMessage for iframe context
        console.warn('⚠️ SDK methods not available - trying postMessage');
        window.parent.postMessage({
          type: 'farcaster:composer',
          data: { text: text, embeds: [gameUrl] }
        }, '*');

        return { success: true };

      } catch (error) {
        console.error('❌ Failed to open share composer:', error);
        return { success: false, error: error.message };
      }
    };
    
    async function initMiniApp() {
      try {
        console.log('[FarCastle] Initializing miniapp...');
        updateLoadingStatus('Connecting to Farcaster...');

        await sdk.actions.ready();
        console.log('[FarCastle] Farcaster SDK ready called');

        const userContext = sdk.context?.user || {};
        console.log('[FarCastle] User context received:', userContext);  // ✅ Add logging
        
        // ✅ FIX: Start with no FID, then get real one or fallback
        currentUserFid = null;
        
        if (userContext.fid && typeof userContext.fid === 'number' && userContext.fid > 0) {
          currentUserFid = userContext.fid;
          console.log('[FarCastle] Using real FID from Farcaster:', currentUserFid);
        } else {
          // Only use test FID if we have no real FID
          currentUserFid = 8451;
          console.warn('[FarCastle] ⚠️ No real FID found, using test FID:', currentUserFid);
        }
        
        console.log('[FarCastle] Final FID being used:', currentUserFid);  // ✅ Confirm final value
        
        const username = userContext.username || 'TestUser';
        
        updateLoadingStatus('Starting game session...');
        
        const response = await fetch(`${API_URL}/api/game/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fid: Number(currentUserFid) })
        });
        
        const data = await response.json();
        currentSessionId = data.sessionId;
        
        window.currentSessionId = currentSessionId;
        window.currentUserFid = currentUserFid;
        window.currentUsername = username;
        window.verifiedScore = 0;

        window.gameInitialized = true;
        
        updateLoadingStatus('Loading game...');
        
        await waitForGodotEngine();
        startGodotGame();
        
      } catch (error) {
        console.error('[FarCastle] Init error:', error);
        updateLoadingStatus('Failed to initialize: ' + error.message);
      }
    }
    
    function waitForGodotEngine() {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const check = setInterval(() => {
          if (typeof window.Engine !== 'undefined') {
            clearInterval(check);
            resolve();
          } else if (++attempts > 50) {
            clearInterval(check);
            reject(new Error('Godot Engine failed to load'));
          }
        }, 100);
      });
    }
    
    function startGodotGame() {
      const engine = new Engine(GODOT_CONFIG);
      
      engine.startGame({
        'onProgress': function (current, total) {
          if (current > 0 && total > 0) {
            const percent = Math.round((current / total) * 100);
            updateLoadingStatus(`Loading... ${percent}%`);
          }
        },
      }).then(() => {
        console.log('[FarCastle] Game started');
      });
    }
    
    // API Functions
    window.sendGameEvent = async function(sessionId, eventType, eventData) {
      if (!window.gameInitialized) return { success: false, score: window.verifiedScore || 0 };
      try {
        const parsedData = typeof eventData === 'string' ? JSON.parse(eventData) : eventData;
        const response = await fetch(`${API_URL}/api/game/event`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, eventType, eventData: parsedData })
        });
        const result = await response.json();
        // Update verified score if backend returns it
        if (result.score !== undefined) {
          window.verifiedScore = result.score;
        }
        return { success: true, score: window.verifiedScore || 0 };
      } catch (error) {
        console.error('[FarCastle] Event error:', error);
        return { success: false, score: window.verifiedScore || 0 };
      }
    };
    
    window.endGame = async function(sessionId) {
      if (!window.gameInitialized || !sessionId) return { success: false };
      try {
        const response = await fetch(`${API_URL}/api/game/end`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, fid: currentUserFid })
        });
        const data = await response.json();
        if (data.score !== undefined) {
          window.verifiedScore = data.score;
        }
        return data;
      } catch (error) {
        return { success: false };
      }
    };

    window.startNewSession = async function() {
      if (!window.gameInitialized) return { success: false };

      try {
        console.log('🔄 Starting new game session...');

        const response = await fetch(`${API_URL}/api/game/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fid: Number(currentUserFid) })
        });

        if (!response.ok) {
          throw new Error(`Session start failed: ${response.status}`);
        }

        const data = await response.json();
        currentSessionId = data.sessionId;
        window.currentSessionId = currentSessionId;
        window.verifiedScore = 0;

        console.log('✅ New session created:', currentSessionId);
        return { success: true, sessionId: currentSessionId };
      } catch (error) {
        console.error('Failed to start new session:', error);
        return { success: false, error: error.message };
      }
    };

    window.getLeaderboard = async function(limit = 10) {
      try {
        const response = await fetch(`${API_URL}/api/leaderboard?limit=${limit}`);
        return await response.json();
      } catch (error) {
        return { leaderboard: [] };
      }
    };
    
    window.getUserScores = async function(limit = 10) {
      if (!currentUserFid) return { scores: [] };
      try {
        const response = await fetch(`${API_URL}/api/user-scores/${currentUserFid}?limit=${limit}`);
        return await response.json();
      } catch (error) {
        return { scores: [] };
      }
    };
    
    window.notifyGodotReady = function() {

    // Farcaster ready was already called in initMiniApp
    console.log('Godot is ready, hiding custom loading screen');

      const loadingDiv = document.getElementById('loading');
      if (loadingDiv) {
        // Keep splash screen visible for 2 seconds after Godot is ready
        // This ensures main menu is fully rendered before hiding
        setTimeout(() => {
          loadingDiv.style.display = 'none';
        }, 2000);
      }
    };

    // Fallback timeout - hide after 7 seconds if notifyGodotReady wasn't called
    setTimeout(() => {
      const loadingDiv = document.getElementById('loading');
      if (loadingDiv && loadingDiv.style.display !== 'none') {
        loadingDiv.style.display = 'none';
      }
    }, 7000);

    initMiniApp();

    } catch (error) {
      console.error('[FarCastle] Module error:', error);
      console.error('[FarCastle] Error stack:', error.stack);
    }
  </script>
