<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <!-- Mini App Embed Metadata -->
  <meta name="fc:miniapp" content='{"version":"1","imageUrl":"https://farcastle-pinball-v2.vercel.app/preview.png","button":{"title":"🎮 Play FarCastle Pinball","action":{"type":"launch_miniapp","url":"https://farcastle-pinball-v2.vercel.app","name":"FarCastle Pinball","splashImageUrl":"https://farcastle-pinball-v2.vercel.app/splash.png","splashBackgroundColor":"#1a1a1a"}}}'>
  
  <title>FarCastle Pinball</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    
    #canvas {
      display: block;
      margin: 0;
      outline: none;
    }
    
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      z-index: 1000;
    }
    
    #loading h2 { font-size: 24px; margin-bottom: 10px; }
    #loading p { font-size: 14px; color: #999; }
    
    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #error {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 0, 0, 0.1);
      border: 2px solid #ff0000;
      border-radius: 8px;
      padding: 20px;
      color: white;
      text-align: center;
      max-width: 400px;
      z-index: 1001;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h2>FarCastle Pinball</h2>
    <div class="spinner"></div>
    <p id="loadingStatus">Initializing...</p>
  </div>
  
  <div id="error">
    <h3>Error</h3>
    <p id="errorMessage"></p>
    <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 20px; background: #ff0000; color: white; border: none; border-radius: 4px; cursor: pointer;">Retry</button>
  </div>
  
  <canvas id="canvas"></canvas>
  
  <!-- Godot will inject its script tag here with $GODOT_HEAD_INCLUDE -->
  $GODOT_HEAD_INCLUDE
  
  <script type="module">
    import { sdk } from 'https://esm.sh/@farcaster/miniapp-sdk@0.1.0';
    
    const API_URL = 'http://localhost:3000';
    const DEBUG = true;
    
    let currentSessionId = null;
    let currentUserFid = null;
    let gameInitialized = false;
    
    function log(message, data = null) {
      if (DEBUG) console.log(`[FarCastle] ${message}`, data || '');
    }
    
    function updateLoadingStatus(status) {
      const statusEl = document.getElementById('loadingStatus');
      if (statusEl) statusEl.textContent = status;
      log(status);
    }
    
    function showError(message) {
      console.error('[FarCastle] Error:', message);
      const errorDiv = document.getElementById('error');
      const errorMsg = document.getElementById('errorMessage');
      const loadingDiv = document.getElementById('loading');
      
      if (errorDiv && errorMsg) {
        errorMsg.textContent = message;
        errorDiv.style.display = 'block';
        if (loadingDiv) loadingDiv.style.display = 'none';
      }
    }
    
    async function initMiniApp() {
      try {
        updateLoadingStatus('Connecting to Farcaster...');
        
        await sdk.actions.ready();
        
        const userContext = sdk.context?.user || {};
        console.log('SDK user context:', userContext);
        
        currentUserFid = 12345;
        if (userContext.fid && typeof userContext.fid === 'number' && userContext.fid > 0) {
          currentUserFid = userContext.fid;
          console.log('Using real FID from Farcaster:', currentUserFid);
        } else {
          console.warn('Using test FID for local development:', currentUserFid);
        }
        
        const username = userContext.username || 'TestUser';
        
        log('User authenticated', { fid: currentUserFid, username });
        
        updateLoadingStatus('Starting game session...');
        
        const response = await fetch(`${API_URL}/api/game/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fid: Number(currentUserFid) })
        });
        
        if (!response.ok) {
          throw new Error(`Session start failed: ${response.status}`);
        }
        
        const data = await response.json();
        currentSessionId = data.sessionId;
        
        window.currentSessionId = currentSessionId;
        window.currentUserFid = currentUserFid;
        window.currentUsername = username;
        window.verifiedScore = 0;
        
        gameInitialized = true;
        
        log('Game session created', { sessionId: currentSessionId });
        updateLoadingStatus('Loading game...');
        
        // Godot will start automatically from its own script
        
      } catch (error) {
        showError(`Failed to initialize: ${error.message}`);
      }
    }
    
    window.sendGameEvent = async function(sessionId, eventType, eventData) {
      if (!gameInitialized) return;
      
      try {
        const parsedData = typeof eventData === 'string' ? JSON.parse(eventData) : eventData;
        
        await fetch(`${API_URL}/api/game/event`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, eventType, eventData: parsedData })
        });
      } catch (error) {
        console.error('[FarCastle] Failed to send event:', error);
      }
    };
    
    window.endGame = async function(sessionId) {
      if (!gameInitialized) return { success: false };
      
      try {
        console.log('🎮 endGame called with sessionId:', sessionId);
        
        const response = await fetch(`${API_URL}/api/game/end`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, fid: currentUserFid })
        });
        
        if (!response.ok) {
          throw new Error(`Game end failed: ${response.status}`);
        }
        
        const data = await response.json();
        window.verifiedScore = data.score;
        
        console.log('Server verified score:', data.score);
        return data;
      } catch (error) {
        console.error('Failed to end game:', error);
        return { success: false, error: error.message };
      }
    };
    
    window.getLeaderboard = async function(limit = 10) {
      try {
        const response = await fetch(`${API_URL}/api/leaderboard?limit=${limit}`);
        return await response.json();
      } catch (error) {
        console.error('[FarCastle] Failed to fetch leaderboard:', error);
        return { leaderboard: [] };
      }
    };
    
    window.getUserScores = async function(limit = 10) {
      if (!currentUserFid) return { scores: [] };
      
      try {
        const response = await fetch(`${API_URL}/api/user-scores/${currentUserFid}?limit=${limit}`);
        return await response.json();
      } catch (error) {
        console.error('[FarCastle] Failed to fetch user scores:', error);
        return { scores: [] };
      }
    };
    
    window.notifyGodotReady = function() {
      console.log('Godot notified ready, hiding loading screen');
      const loadingDiv = document.getElementById('loading');
      if (loadingDiv) {
        loadingDiv.style.display = 'none';
      }
    };
    
    initMiniApp();
  </script>
  
  <!-- Godot's initialization will be inserted here -->
  $GODOT_BODY_INCLUDE
</body>
</html>
